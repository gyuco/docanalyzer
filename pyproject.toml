[project]
name = "docanalyzer"
version = "0.1.0"
description = "Lettura e analisi di documenti (bancari, fatture, ...) con backend LLM intercambiabili"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "markitdown[docx,xlsx,pptx,outlook]>=0.1.3",
    "ollama>=0.4",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Fase 2: OCR + layout/tabelle avanzate. Pesante, si installa solo quando serve.
ocr = ["docling>=2.15"]
# Backend cloud, opzionali.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]

[project.scripts]
docanalyzer = "docanalyzer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docanalyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
